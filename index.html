<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#59684f" />
  <title>Maedeh ✨️ Planner</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <div class="sidebar-inner">
        <div class="brand-card">
          <img src="icons/icon-192.png" alt="Sweet Smile Studio" class="brand-icon" />
          <div>
            <h1>Maedeh ✨️</h1>
            <p>Sweet Smile Studio Planner</p>
          </div>
        </div>
        <nav class="nav" aria-label="Planner navigation">
          <div class="nav-group">
            <span class="nav-group-label">اصلی</span>
            <button data-view="home" class="nav-item"><span class="nav-glyph">◈</span> خانه</button>
            <button data-view="today" class="nav-item active"><span class="nav-glyph">◈</span> امروز</button>
            <button data-view="week" class="nav-item"><span class="nav-glyph">▤</span> هفته</button>
            <button data-view="month" class="nav-item"><span class="nav-glyph">▦</span> ماه</button>
          </div>
          <div class="nav-group">
            <span class="nav-group-label">ذهن و برنامه‌ریزی</span>
            <button data-view="ideas" class="nav-item"><span class="nav-glyph">✧</span> ایده‌ها</button>
            <button data-view="brain" class="nav-item"><span class="nav-glyph">◇</span> بارش فکری</button>
            <button data-view="habits" class="nav-item"><span class="nav-glyph">☷</span> عادت‌ها</button>
            <button data-view="tools" class="nav-item"><span class="nav-glyph">⌁</span> ابزارها</button>
            <button data-view="pomodoro" class="nav-item"><span class="nav-glyph">◷</span> پومودورو</button>
          </div>
          <div class="nav-group">
            <span class="nav-group-label">فوتبال</span>
            <button data-view="training" class="nav-item"><span class="nav-glyph">⚽</span> تمرین و مسابقات</button>
            <button data-view="goals" class="nav-item"><span class="nav-glyph">🎯</span> اهداف و ماموریت‌ها</button>
            <button data-view="performance" class="nav-item"><span class="nav-glyph">📊</span> عملکرد و آمار</button>
            <button data-view="tactics" class="nav-item"><span class="nav-glyph">📝</span> یادداشت و تاکتیک</button>
            <button data-view="achievements" class="nav-item"><span class="nav-glyph">🏆</span> دستاوردها</button>
          </div>
          <div class="nav-group">
            <span class="nav-group-label">بدن</span>
            <button data-view="diet" class="nav-item"><span class="nav-glyph">🥗</span> تغذیه و سلامت</button>
          </div>
          <div class="nav-group">
            <span class="nav-group-label">حساب کاربری</span>
            <button data-view="profile" class="nav-item"><span class="nav-glyph">⚙</span> پروفایل و تنظیمات</button>
          </div>
        </nav>
        <div class="install-box">
          <button id="installBtn" class="premium-btn muted" hidden>نصب مثل اپ</button>
          <button id="notifyBtn" class="premium-btn">فعال‌سازی نوتیفیکیشن</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="open menu">☰</button>
        <div class="date-title">
          <span class="today-line"><span id="viewLabel">امروز</span><b id="currentTimeLabel" class="live-clock">--:--</b></span>
          <strong id="currentDateLabel"></strong>
          <small><span id="gregorianDateLabel"></span></small>
        </div>
        <div class="date-controls">
          <button id="prevDay" class="icon-btn">‹</button>
          <input id="datePicker" type="date" />
          <button id="nextDay" class="icon-btn">›</button>
        </div>
      </header>

      <div class="views-container">
        <section id="home" class="view"></section>
        <section id="today" class="view active"></section>
        <section id="week" class="view"></section>
        <section id="month" class="view"></section>
        <section id="ideas" class="view"></section>
        <section id="brain" class="view"></section>
        <section id="habits" class="view"></section>
        <section id="tools" class="view"></section>
        <section id="pomodoro" class="view"></section>
        <section id="training" class="view"></section>
        <section id="goals" class="view"></section>
        <section id="performance" class="view"></section>
        <section id="diet" class="view"></section>
        <section id="tactics" class="view"></section>
        <section id="achievements" class="view"></section>
        <section id="profile" class="view"></section>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button data-view="home" class="bottom-nav-item">
      <span class="bottom-nav-glyph">◈</span>
      <span class="bottom-nav-label">خانه</span>
    </button>
    <button data-view="today" class="bottom-nav-item active">
      <span class="bottom-nav-glyph">◈</span>
      <span class="bottom-nav-label">امروز</span>
    </button>
    <button data-view="brain" class="bottom-nav-item">
      <span class="bottom-nav-glyph">◇</span>
      <span class="bottom-nav-label">بارش فکری</span>
    </button>
  </nav>

  <template id="cardTemplate">
    <article class="panel section-card">
      <div class="panel-head">
        <h2></h2>
        <div class="panel-actions"></div>
      </div>
      <div class="panel-body"></div>
    </article>
  </template>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
